# Buzz relay (block/buzz) - adapted from deploy/compose/compose.yml for Coolify.
# Tailnet-only: relay published on the Tailscale IP, no domain, no Traefik.
# Clients use HTTPS via Tailscale Serve on the host (MagicDNS + Let's Encrypt):
#   tailscale serve --bg --https=8443 http://100.105.137.33:3000   (relay)
#   tailscale serve --bg --https=8444 http://100.105.137.33:5000   (pair-relay)
# The Buzz mobile app refuses non-HTTPS relay URLs in release builds.
# Secrets come from Coolify magic variables (generated by Coolify, stable across redeploys).
services:
  relay:
    image: ghcr.io/block/buzz:sha-33f54de
    environment:
      BUZZ_BIND_ADDR: 0.0.0.0:3000
      BUZZ_HEALTH_PORT: "8080"
      BUZZ_METRICS_PORT: "9102"
      RELAY_URL: wss://ai-assistant.taild75039.ts.net:8443
      BUZZ_MEDIA_BASE_URL: https://ai-assistant.taild75039.ts.net:8443/media
      BUZZ_MEDIA_SERVER_DOMAIN: ai-assistant.taild75039.ts.net
      BUZZ_CORS_ORIGINS: https://ai-assistant.taild75039.ts.net:8443
      BUZZ_REQUIRE_AUTH_TOKEN: "true"
      BUZZ_REQUIRE_RELAY_MEMBERSHIP: "true"
      BUZZ_ALLOW_NIP_OA_AUTH: "true"
      BUZZ_AUTO_MIGRATE: "true"
      BUZZ_GIT_CONFORMANCE_PROBE: "true"
      BUZZ_PUSH_ENABLED: "false"
      RUST_LOG: buzz_relay=info,buzz_db=info,buzz_auth=info,buzz_pubsub=info,tower_http=info
      RELAY_OWNER_PUBKEY: ${RELAY_OWNER_PUBKEY}
      BUZZ_RELAY_PRIVATE_KEY: ${SERVICE_HEX_64_RELAYKEY}
      BUZZ_GIT_HOOK_HMAC_SECRET: ${SERVICE_HEX_64_GITHOOK}
      DATABASE_URL: postgres://buzz:${SERVICE_PASSWORD_64_POSTGRES}@postgres:5432/buzz
      REDIS_URL: redis://:${SERVICE_PASSWORD_64_REDIS}@redis:6379
      BUZZ_S3_ENDPOINT: http://minio:9000
      BUZZ_S3_ADDRESSING_STYLE: path
      BUZZ_S3_ACCESS_KEY: ${SERVICE_USER_MINIO}
      BUZZ_S3_SECRET_KEY: ${SERVICE_PASSWORD_64_MINIO}
      BUZZ_S3_BUCKET: buzz-media
      BUZZ_GIT_REPO_PATH: /data/git
      # Device pairing (QR) sidecar below; upstream compose omits it (block/buzz#7721).
      BUZZ_PAIRING_RELAY_URL: wss://ai-assistant.taild75039.ts.net:8444
    ports:
      - "100.105.137.33:3000:3000"
    volumes:
      - buzz-git-data:/data/git
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # Probe /_readiness over /dev/tcp because the runtime image has bash but no curl/wget/socat.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /_readiness HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  pair-relay:
    # Pairing WebSocket for linking devices (QR flow). Same pinned image as the
    # relay; the binary ships in it but upstream compose never starts it.
    image: ghcr.io/block/buzz:sha-33f54de
    entrypoint: ["/usr/local/bin/buzz-pair-relay"]
    environment:
      BUZZ_PAIR_RELAY_BIND_ADDR: 0.0.0.0:5000
    ports:
      - "100.105.137.33:5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/5000'"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: buzz
      POSTGRES_USER: buzz
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - buzz-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buzz -d buzz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${SERVICE_PASSWORD_64_REDIS}
    volumes:
      - buzz-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  minio:
    # quay.io/minio is no longer anonymously pullable (block/buzz#7880); Block-built
    # replacement with the same MinIO + mc releases.
    image: ghcr.io/block/buzz-minio@sha256:b8470bbeafbf57b20c86cf63804682b714bdcfdbb517f3770247e321e623f48f
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${SERVICE_USER_MINIO}
      MINIO_ROOT_PASSWORD: ${SERVICE_PASSWORD_64_MINIO}
    volumes:
      - buzz-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  minio-init:
    image: ghcr.io/block/buzz-minio@sha256:b8470bbeafbf57b20c86cf63804682b714bdcfdbb517f3770247e321e623f48f
    depends_on:
      minio:
        condition: service_healthy
    environment:
      BUZZ_S3_ACCESS_KEY: ${SERVICE_USER_MINIO}
      BUZZ_S3_SECRET_KEY: ${SERVICE_PASSWORD_64_MINIO}
      BUZZ_S3_BUCKET: buzz-media
    entrypoint:
      - /bin/sh
      - -euc
      - |
        mc alias set local http://minio:9000 "$${BUZZ_S3_ACCESS_KEY}" "$${BUZZ_S3_SECRET_KEY}"
        mc mb --ignore-existing "local/$${BUZZ_S3_BUCKET}"
        mc anonymous set none "local/$${BUZZ_S3_BUCKET}"
    exclude_from_hc: true
    restart: "no"

volumes:
  buzz-postgres-data:
  buzz-redis-data:
  buzz-minio-data:
  buzz-git-data:
